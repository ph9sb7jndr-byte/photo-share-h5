<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>日常分享</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:#F5F6F8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}

/* ── Header ── */
.hdr{position:fixed;top:0;left:0;right:0;height:56px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.06);z-index:100}
.hdr-title{font-size:17px;font-weight:600;color:#1A1A1A;letter-spacing:.3px}
.hdr-actions{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;gap:4px}
.hdr-btn{background:none;border:none;cursor:pointer;padding:8px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:background .15s}
.hdr-btn:active{background:#F0F0F0}
.hdr-btn svg{width:22px;height:22px;color:#555}

/* ── Tabs ── */
.tabs{position:fixed;top:56px;left:0;right:0;height:44px;background:#fff;display:flex;border-bottom:1px solid rgba(0,0,0,.06);z-index:99}
.tab{flex:1;display:flex;align-items:center;justify-content:center;font-size:14px;color:#888;cursor:pointer;border:none;background:none;font-family:inherit;position:relative;transition:color .2s}
.tab.active{color:#5B9BD5;font-weight:600}
.tab.active::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:24px;height:3px;background:#5B9BD5;border-radius:2px}

/* ── Main ── */
.main{padding-top:100px;padding-bottom:90px}

/* ── Waterfall Grid ── */
.grid{column-count:2;column-gap:10px;padding:12px}

/* ── Photo Card ── */
.card{background:#fff;border-radius:12px;overflow:hidden;margin-bottom:10px;break-inside:avoid;box-shadow:0 1px 4px rgba(0,0,0,.06);animation:cardIn .35s ease-out}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card img{width:100%;display:block;background:#EDEDED;min-height:80px}
.card-body{padding:10px 12px 12px}
.card-desc{font-size:13px;line-height:1.6;color:#333;margin:0;word-break:break-word}
.card-nick{font-size:11px;color:#5B9BD5;margin-top:6px;display:flex;align-items:center;gap:4px}
.card-nick-avatar{width:16px;height:16px;border-radius:8px;background:linear-gradient(135deg,#5B9BD5,#4A89C8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600}
.card-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.card-time{font-size:11px;color:#B0B0B0}
.card-acts{display:flex;align-items:center;gap:14px}
.act-btn{display:flex;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:2px;font-family:inherit;color:#999;transition:color .2s}
.act-btn.liked{color:#FF6B81}
.act-btn.liked .heart-icon{fill:#FF6B81}
.act-btn .heart-icon{transition:all .2s}
.act-btn .like-count{font-size:12px;min-width:12px;text-align:center}

/* ── Empty State ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:140px;color:#BCBCBC}
.empty svg{width:52px;height:52px;stroke-width:1.2}
.empty p{margin-top:16px;font-size:15px;text-align:center;line-height:1.6}

/* ── Ranking List ── */
.rank-list{padding:12px}
.rank-item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);animation:cardIn .35s ease-out}
.rank-badge{width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.rank-badge.top1{background:linear-gradient(135deg,#FFD700,#FFA500);color:#fff}
.rank-badge.top2{background:linear-gradient(135deg,#C0C0C0,#A0A0A0);color:#fff}
.rank-badge.top3{background:linear-gradient(135deg,#CD7F32,#A0522D);color:#fff}
.rank-badge.normal{background:#F5F7FA;color:#888}
.rank-img{width:60px;height:60px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#EDEDED}
.rank-info{flex:1;min-width:0}
.rank-desc{font-size:13px;color:#333;line-height:1.5;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rank-meta{display:flex;align-items:center;gap:12px;margin-top:6px;font-size:11px;color:#B0B0B0}
.rank-likes{display:flex;align-items:center;gap:3px;color:#FF6B81}
.rank-likes svg{width:12px;height:12px;fill:#FF6B81}

/* ── User List ── */
.user-list{padding:12px}
.user-item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:14px 12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);animation:cardIn .35s ease-out}
.user-avatar{width:44px;height:44px;border-radius:22px;background:linear-gradient(135deg,#5B9BD5,#4A89C8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-nick{font-size:14px;font-weight:500;color:#1A1A1A}
.user-stats{display:flex;gap:16px;margin-top:4px;font-size:11px;color:#B0B0B0}
.user-stat{display:flex;align-items:center;gap:3px}
.user-stat svg{width:12px;height:12px}

/* ── FAB ── */
.fab{position:fixed;bottom:28px;right:20px;width:56px;height:56px;border-radius:28px;background:linear-gradient(135deg,#5B9BD5,#4A89C8);color:#fff;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(91,155,213,.4);cursor:pointer;z-index:90;transition:transform .15s,box-shadow .15s}
.fab:active{transform:scale(.92);box-shadow:0 2px 10px rgba(91,155,213,.3)}
.fab svg{width:24px;height:24px}

/* ── Overlay ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:200;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ── Upload Modal ── */
.modal{width:100%;max-width:420px;background:#fff;border-radius:20px 20px 0 0;padding:20px 20px 28px;max-height:92vh;overflow-y:auto;animation:slideUp .3s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-close{display:flex;justify-content:flex-end;margin-bottom:4px}
.modal-close-btn{width:30px;height:30px;border-radius:15px;background:#F2F2F2;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#888;transition:background .15s}
.modal-close-btn:active{background:#E5E5E5}
.modal-close-btn svg{width:16px;height:16px}

.modal-title{font-size:18px;font-weight:600;color:#1A1A1A;margin:4px 0 20px;text-align:center}
.src-row{display:flex;gap:16px;justify-content:center}
.src-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:110px;height:110px;border-radius:16px;background:#F5F7FA;border:none;cursor:pointer;transition:background .15s;font-family:inherit}
.src-btn:active{background:#EAECEF}
.src-btn svg{width:32px;height:32px;color:#5B9BD5}
.src-btn span{font-size:13px;color:#555}

/* Input field */
.input-field{width:100%;height:44px;margin-top:14px;padding:0 12px;border:1px solid #E8E8E8;border-radius:10px;font-size:14px;outline:none;font-family:inherit;color:#333;transition:border-color .2s}
.input-field:focus{border-color:#5B9BD5}
.input-field::placeholder{color:#C0C0C0}

/* Preview */
.preview-wrap{position:relative;border-radius:12px;overflow:hidden;background:#F0F0F0}
.preview-img{width:100%;max-height:300px;object-fit:contain;display:block}
.preview-rm{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:14px;background:rgba(0,0,0,.45);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.preview-rm:active{background:rgba(0,0,0,.65)}
.preview-rm svg{width:14px;height:14px}

.desc-input{width:100%;min-height:72px;margin-top:14px;padding:12px;border:1px solid #E8E8E8;border-radius:10px;font-size:14px;line-height:1.6;resize:vertical;outline:none;font-family:inherit;color:#333;transition:border-color .2s}
.desc-input:focus{border-color:#5B9BD5}
.desc-input::placeholder{color:#C0C0C0}
.desc-count{text-align:right;font-size:11px;color:#C0C0C0;margin-top:4px}

.post-btn{width:100%;height:46px;margin-top:8px;border-radius:23px;background:linear-gradient(135deg,#5B9BD5,#4A89C8);color:#fff;font-size:16px;font-weight:500;letter-spacing:1px;border:none;cursor:pointer;font-family:inherit;transition:opacity .15s}
.post-btn:active{opacity:.85}
.post-btn:disabled{background:#CCC;cursor:not-allowed}

/* ── Share Sheet ── */
.share-sheet{width:100%;max-width:420px;background:#fff;border-radius:20px 20px 0 0;padding:20px 20px 32px;animation:slideUp .3s ease-out}
.share-title{font-size:15px;font-weight:500;color:#1A1A1A;margin:0 0 20px;text-align:center}
.share-row{display:flex;justify-content:center;gap:28px}
.share-item{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:none;cursor:pointer;padding:0;font-family:inherit}
.share-icon{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;transition:opacity .15s}
.share-item:active .share-icon{opacity:.75}
.share-icon svg{width:20px;height:20px;color:#fff}
.share-label{font-size:11px;color:#888}
.share-cancel{width:100%;height:48px;margin-top:24px;border-radius:24px;background:#F2F2F2;color:#666;font-size:15px;border:none;cursor:pointer;font-family:inherit;transition:background .15s}
.share-cancel:active{background:#E5E5E5}

/* ── QR Modal ── */
.qr-sheet{width:100%;max-width:420px;background:#fff;border-radius:20px 20px 0 0;padding:28px 24px 32px;animation:slideUp .3s ease-out}
.qr-title{font-size:17px;font-weight:600;color:#1A1A1A;margin:0 0 6px;text-align:center}
.qr-sub{font-size:13px;color:#999;margin:0 0 20px;text-align:center}
.qr-box{display:flex;justify-content:center;align-items:center;padding:20px;background:#FAFAFA;border-radius:16px;margin:0 auto 16px;max-width:260px}
.qr-box canvas,.qr-box img{max-width:100%!important;height:auto!important;border-radius:4px}
.qr-url-row{display:flex;gap:8px;align-items:center;margin-top:12px}
.qr-url{flex:1;padding:10px 12px;background:#F5F7FA;border-radius:10px;font-size:12px;color:#666;word-break:break-all;line-height:1.5;border:1px solid #EAEAEA}
.qr-copy{padding:10px 14px;border-radius:10px;background:#5B9BD5;color:#fff;border:none;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;white-space:nowrap;transition:opacity .15s}
.qr-copy:active{opacity:.8}
.qr-tip{font-size:12px;color:#B0B0B0;margin:14px 0 0;text-align:center;line-height:1.6}

/* ── Loading ── */
.loading{display:flex;justify-content:center;padding:40px;color:#B0B0B0;font-size:13px}

/* ── Info Box ── */
.info-box{background:#F0F7FF;border:1px solid #D0E3FF;border-radius:12px;padding:16px;margin:12px;font-size:13px;color:#5B9BD5;line-height:1.8}
.info-box strong{color:#4A89C8}
</style>
</head>
<body>

<!-- ═══ Header ═══ -->
<header class="hdr">
  <span class="hdr-title">日常分享</span>
  <div class="hdr-actions">
    <button class="hdr-btn" onclick="openQR()" title="生成二维码">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="3" height="3"/>
        <line x1="21" y1="14" x2="21" y2="17"/><line x1="14" y1="21" x2="17" y2="21"/>
      </svg>
    </button>
  </div>
</header>

<!-- ═══ Tabs ═══ -->
<div class="tabs">
  <button class="tab active" data-tab="photos" onclick="switchTab('photos')">照片墙</button>
  <button class="tab" data-tab="rankings" onclick="switchTab('rankings')">排行榜</button>
  <button class="tab" data-tab="users" onclick="switchTab('users')">用户</button>
</div>

<!-- ═══ Main ═══ -->
<main class="main">
  <div id="tab-photos" class="tab-content">
    <div id="grid" class="grid"></div>
  </div>
  <div id="tab-rankings" class="tab-content" style="display:none">
    <div id="rankList" class="rank-list"></div>
  </div>
  <div id="tab-users" class="tab-content" style="display:none">
    <div id="userList" class="user-list"></div>
  </div>
</main>

<!-- ═══ FAB ═══ -->
<button class="fab" onclick="openUpload()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
    <circle cx="12" cy="13" r="4"/>
  </svg>
</button>

<!-- ═══ Upload Modal ═══ -->
<div id="uploadOv" class="ov" style="display:none" onclick="closeUpload(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-close">
      <button class="modal-close-btn" onclick="closeUpload()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="uploadBody"></div>
  </div>
</div>

<!-- ═══ Share Sheet ═══ -->
<div id="shareOv" class="ov" style="display:none" onclick="closeShare(event)">
  <div class="share-sheet" onclick="event.stopPropagation()">
    <p class="share-title">分享到</p>
    <div class="share-row">
      <button class="share-item" onclick="doShare()"><span class="share-icon" style="background:#07C160"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 13.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5S10 11.17 10 12s-.67 1.5-1.5 1.5zm7 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5S17 11.17 17 12s-.67 1.5-1.5 1.5zM12 2C6.48 2 2 6.04 2 11c0 2.76 1.36 5.22 3.48 6.87L4 22l4.63-2.32C9.72 19.89 10.84 20 12 20c5.52 0 10-4.04 10-9s-4.48-9-10-9z"/></svg></span><span class="share-label">微信</span></button>
      <button class="share-item" onclick="doShare()"><span class="share-icon" style="background:#576B95"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"/></svg></span><span class="share-label">朋友圈</span></button>
      <button class="share-item" onclick="doShare()"><span class="share-icon" style="background:#12B7F5"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"/></svg></span><span class="share-label">QQ</span></button>
      <button class="share-item" onclick="doShare()"><span class="share-icon" style="background:#E6162D"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"/></svg></span><span class="share-label">微博</span></button>
    </div>
    <button class="share-cancel" onclick="closeShare()">取消</button>
  </div>
</div>

<!-- ═══ QR Modal ═══ -->
<div id="qrOv" class="ov" style="display:none" onclick="closeQR(event)">
  <div class="qr-sheet" onclick="event.stopPropagation()">
    <p class="qr-title">扫码参与</p>
    <p class="qr-sub">扫描下方二维码，打开页面参与分享</p>
    <div id="qrBox" class="qr-box"></div>
    <div class="qr-url-row">
      <div id="qrUrl" class="qr-url"></div>
      <button class="qr-copy" onclick="copyURL()">复制</button>
    </div>
    <p class="qr-tip">提示：需将页面部署到线上服务器后，<br>他人扫码才能正常访问</p>
    <button class="share-cancel" style="margin-top:18px" onclick="closeQR()">关闭</button>
  </div>
</div>

<!-- Hidden file inputs -->
<input id="camIn" type="file" accept="image/*" capture="environment" style="display:display:none">
<input id="albIn" type="file" accept="image/*" style="display:none">

<script>
/* ═══ State ═══ */
let photos = [];
let likedPhotos = new Set();
let currentTab = 'photos';

/* ═══ SVG Icons ═══ */
const IC = {
  heart: (f) => `<svg class="heart-icon" width="16" height="16" viewBox="0 0 24 24" fill="${f?'#FF6B81':'none'}" stroke="${f?'#FF6B81':'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
  share: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>`,
  x: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  cam: `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#5B9BD5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`,
  up: `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#5B9BD5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>`,
  empty: `<svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
  photo: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
  heart12: `<svg width="12" height="12" viewBox="0 0 24 24" fill="#FF6B81" stroke="#FF6B81" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
};

/* ═══ Load Data from data.json ═══ */
async function loadData() {
  try {
    const res = await fetch('./data.json?t=' + Date.now());
    if (!res.ok) throw new Error('Failed to load');
    const json = await res.json();
    photos = json.photos || [];
    return true;
  } catch (e) {
    console.error('Load data error:', e);
    return false;
  }
}

/* ═══ Render Photos ═══ */
function renderPhotos() {
  const g = document.getElementById('grid');
  if (!photos.length) {
    g.innerHTML = `<div class="empty">${IC.empty}<p>还没有照片，快来分享第一张吧</p></div>`;
    return;
  }
  const sorted = [...photos].sort((a, b) => b.id - a.id);
  g.innerHTML = sorted.map(p => {
    const liked = likedPhotos.has(p.id);
    return `
    <div class="card">
      <img src="${p.url}" alt="" loading="lazy">
      <div class="card-body">
        <p class="card-desc">${p.desc}</p>
        ${p.nickname ? `<div class="card-nick"><span class="card-nick-avatar">${p.nickname[0]}</span>${p.nickname}</div>` : ''}
        <div class="card-row">
          <span class="card-time">${formatTime(p.time)}</span>
          <div class="card-acts">
            <button class="act-btn${liked?' liked':''}" onclick="toggleLike(${p.id})">${IC.heart(liked)}<span class="like-count">${p.likes}</span></button>
            <button class="act-btn" onclick="openShare()">${IC.share}</button>
          </div>
        </div>
      </div>
    </div>
  `}).join('');
}

/* ═══ Render Rankings ═══ */
function renderRankings() {
  const list = document.getElementById('rankList');
  if (!photos.length) {
    list.innerHTML = `<div class="empty">${IC.empty}<p>暂无排行数据</p></div>`;
    return;
  }
  const ranked = [...photos].sort((a, b) => b.likes - a.likes).slice(0, 20);
  list.innerHTML = ranked.map((p, i) => {
    const rank = i + 1;
    const badgeClass = rank === 1 ? 'top1' : rank === 2 ? 'top2' : rank === 3 ? 'top3' : 'normal';
    return `
      <div class="rank-item">
        <div class="rank-badge ${badgeClass}">${rank}</div>
        <img class="rank-img" src="${p.url}" alt="" loading="lazy">
        <div class="rank-info">
          <p class="rank-desc">${p.desc}</p>
          <div class="rank-meta">
            ${p.nickname ? `<span>${p.nickname}</span>` : ''}
            <span class="rank-likes">${IC.heart12}${p.likes}</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

/* ═══ Render Users ═══ */
function renderUsers() {
  const list = document.getElementById('userList');
  if (!photos.length) {
    list.innerHTML = `<div class="empty">${IC.empty}<p>暂无用户数据</p></div>`;
    return;
  }
  const userMap = {};
  photos.forEach(p => {
    const nick = p.nickname || '匿名';
    if (!userMap[nick]) userMap[nick] = {nickname: nick, photoCount: 0, totalLikes: 0};
    userMap[nick].photoCount++;
    userMap[nick].totalLikes += p.likes;
  });
  const users = Object.values(userMap).sort((a, b) => b.photoCount - a.photoCount);
  list.innerHTML = users.map(u => `
    <div class="user-item">
      <div class="user-avatar">${u.nickname[0]}</div>
      <div class="user-info">
        <div class="user-nick">${u.nickname}</div>
        <div class="user-stats">
          <span class="user-stat">${IC.photo}${u.photoCount} 张照片</span>
          <span class="user-stat">${IC.heart12}${u.totalLikes} 获赞</span>
        </div>
      </div>
    </div>
  `).join('');
}

/* ═══ Tab Switch ═══ */
async function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
  document.getElementById('tab-' + tab).style.display = 'block';

  if (tab === 'photos') renderPhotos();
  else if (tab === 'rankings') renderRankings();
  else if (tab === 'users') renderUsers();
}

/* ═══ Like (local only) ═══ */
function toggleLike(id) {
  const photo = photos.find(p => p.id === id);
  if (!photo) return;
  if (likedPhotos.has(id)) {
    likedPhotos.delete(id);
    photo.likes--;
  } else {
    likedPhotos.add(id);
    photo.likes++;
  }
  if (currentTab === 'photos') renderPhotos();
  else if (currentTab === 'rankings') renderRankings();
}

/* ═══ Time Format ═══ */
function formatTime(timeStr) {
  if (!timeStr) return '刚刚';
  const date = new Date(timeStr);
  const now = new Date();
  const diff = now - date;
  const mins = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days = Math.floor(diff / 86400000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return mins + '分钟前';
  if (hours < 24) return hours + '小时前';
  if (days < 7) return days + '天前';
  return timeStr.split(' ')[0];
}

/* ═══ Upload Modal ═══ */
function openUpload() {
  document.getElementById('uploadBody').innerHTML = `
    <p class="modal-title">分享照片</p>
    <div class="info-box">
      <strong>如何添加照片：</strong><br>
      把照片和昵称发给管理员，由管理员添加到页面。<br><br>
      <strong>格式：</strong><br>
      昵称：你的名字<br>
      描述：一句话描述<br>
      图片：直接发照片即可
    </div>
    <button class="post-btn" onclick="closeUpload()" style="margin-top:12px">我知道了</button>
  `;
  document.getElementById('uploadOv').style.display = 'flex';
}
function closeUpload(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('uploadOv').style.display = 'none';
}

/* ═══ Share ═══ */
function openShare() { document.getElementById('shareOv').style.display = 'flex'; }
function closeShare(e) { if (e && e.target !== e.currentTarget) return; document.getElementById('shareOv').style.display = 'none'; }
function doShare() {
  document.getElementById('shareOv').style.display = 'none';
  if (navigator.share) {
    navigator.share({title:'日常分享', text:'来看看我的照片吧！', url:location.href}).catch(()=>{});
  } else {
    copyURL();
  }
}

/* ═══ QR Code ═══ */
function openQR() {
  document.getElementById('qrOv').style.display = 'flex';
  const url = location.href;
  document.getElementById('qrUrl').textContent = url;
  const box = document.getElementById('qrBox');
  box.innerHTML = '';
  if (typeof QRCode !== 'undefined') {
    new QRCode(box, {text:url, width:200, height:200, colorDark:'#1A1A1A', colorLight:'#fff', correctLevel:QRCode.CorrectLevel.M});
  } else {
    box.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}" alt="QR" style="width:200px;height:200px;border-radius:4px">`;
  }
}
function closeQR(e) { if (e && e.target !== e.currentTarget) return; document.getElementById('qrOv').style.display = 'none'; }
function copyURL() {
  const url = location.href;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => toast('链接已复制')).catch(() => fallbackCopy(url));
  } else { fallbackCopy(url); }
}
function fallbackCopy(t) {
  const a = document.createElement('textarea'); a.value = t;
  a.style.cssText = 'position:fixed;left:-9999px';
  document.body.appendChild(a); a.select();
  try { document.execCommand('copy'); toast('链接已复制'); } catch(e) { toast('请手动复制地址栏链接'); }
  document.body.removeChild(a);
}
function toast(msg) {
  const d = document.createElement('div');
  d.textContent = msg;
  d.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:10px 22px;border-radius:20px;font-size:14px;z-index:999;animation:fadeIn .2s';
  document.body.appendChild(d);
  setTimeout(() => { d.style.opacity = '0'; d.style.transition = 'opacity .3s'; setTimeout(() => d.remove(), 300); }, 1800);
}

/* ═══ Init ═══ */
(async function init() {
  const g = document.getElementById('grid');
  g.innerHTML = '<div class="loading">加载中...</div>';
  const ok = await loadData();
  if (ok) {
    renderPhotos();
  } else {
    g.innerHTML = `<div class="empty">${IC.empty}<p>加载失败，请刷新页面重试</p></div>`;
  }
})();
</script>
